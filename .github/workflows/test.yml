name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # The test suite only exercises the pure-JS HTTP API and text helpers, so
      # skip install scripts to keep CI fast (no native builds are needed).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
